name: run-all-tests

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser for the UI tests
        type: choice
        options: [chrome, firefox]
        default: chrome

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run UI tests
        run: pytest tests/ui --browser ${{ inputs.browser }}

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-results-${{ inputs.browser }}
          path: |
            reports/
            screenshots/
          if-no-files-found: ignore

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest tests/api

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: reports/
          if-no-files-found: ignore
